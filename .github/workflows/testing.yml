name: Remote File Downloader

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download file
        # IMPORTANT: Hardcoding passwords in your workflow file is a security risk. 
        # It is highly recommended to move these to GitHub Secrets (e.g., secrets.WEBDAV_USER)
        env:
          USER: "yfnn"
          PASS: "jprbdhid"
        run: |
          mkdir -p /tmp/downloads
          cd /tmp/downloads

          URL=$(cat $GITHUB_WORKSPACE/link.txt | tr -d '\n\r ')

          echo "Starting download from: $URL"

          # Added -u "$USER:$PASS" for WebDAV authentication
          curl -L \
            --fail \
            --show-error \
            --retry 3 \
            --connect-timeout 30 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -u "$USER:$PASS" \
            -o downloaded_file \
            "$URL"

          echo "Download completed!"

          ls -lh downloaded_file

      - name: Cleanup
        if: always()
        run: |
          rm -rf /tmp/downloads
          echo "Temporary files deleted."
