name: Remote File Downloader

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and Redownload Loop
        env:
          USER: "yfnn"
          PASS: "jprbdhid"
        run: |
          mkdir -p /tmp/downloads
          
          if [ ! -f "$GITHUB_WORKSPACE/link.txt" ]; then
            echo "Error: link.txt not found in the repository root!"
            exit 1
          fi

          URL=$(cat $GITHUB_WORKSPACE/link.txt | tr -d '\n\r ')

          for i in 1 2; do
            cd /tmp/downloads
            
            echo "--- Iteration $i: Starting download ---"
            
            curl --location-trusted \
              --anyauth \
              --fail \
              --show-error \
              --retry 3 \
              --connect-timeout 30 \
              -u "$USER:$PASS" \
              -o downloaded_file \
              "$URL"

            echo "Download completed!"
            ls -lh downloaded_file
            
            if [ $i -eq 1 ]; then
              echo "Deleting file for redownload..."
              rm downloaded_file
            fi
          done

      # NEW STEP: Save the file so you can download it to your PC
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-video
          path: /tmp/downloads/downloaded_file
          retention-days: 1

      - name: Cleanup
        if: always()
        run: |
          rm -rf /tmp/downloads
          echo "Temporary files deleted."
