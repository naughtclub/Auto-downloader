name: Remote File Downloader

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # This step is strictly required to read link.txt
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download file
        env:
          USER: "yfnn"
          PASS: "jprbdhid"
        run: |
          mkdir -p /tmp/downloads
          cd /tmp/downloads

          if [ ! -f "$GITHUB_WORKSPACE/link.txt" ]; then
            echo "Error: link.txt not found in the repository root!"
            exit 1
          fi

          URL=$(cat $GITHUB_WORKSPACE/link.txt | tr -d '\n\r ')

          echo "Starting download from: $URL"

          curl --location-trusted \
            --anyauth \
            --fail \
            --show-error \
            --retry 3 \
            --connect-timeout 30 \
            -u "$USER:$PASS" \
            -o downloaded_file \
            "$URL"

          echo "Download completed!"

          ls -lh downloaded_file

      - name: Cleanup
        if: always()
        run: |
          rm -rf /tmp/downloads
          echo "Temporary files deleted."
