name: Remote File Downloader

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Download file
        env:
          USER: "yfnn"
          PASS: "jprbdhid"
        run: |
          mkdir -p /tmp/downloads
          cd /tmp/downloads

          URL=$(cat $GITHUB_WORKSPACE/link.txt | tr -d '\n\r ')

          echo "Starting download from: $URL"

          # Replaced -L with --location-trusted and added --anyauth
          # Removed the Chrome User-Agent spoofing
          curl --location-trusted \
            --anyauth \
            --fail \
            --show-error \
            --retry 3 \
            --connect-timeout 30 \
            -u "$USER:$PASS" \
            -o downloaded_file \
            "$URL"

          echo "Download completed!"

          ls -lh downloaded_file
