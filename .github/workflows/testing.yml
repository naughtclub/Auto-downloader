name: Remote File Downloader

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and Delete Loop
        env:
          USER: "yfnn"
          PASS: "jprbdhid"
        run: |
          mkdir -p /tmp/downloads
          
          if [ ! -f "$GITHUB_WORKSPACE/link.txt" ]; then
            echo "Error: link.txt not found in the repository root!"
            exit 1
          fi

          URL=$(cat $GITHUB_WORKSPACE/link.txt | tr -d '\n\r ')
          COUNTER=1

          # Infinite loop: Download, delete, and repeat
          while true; do
            cd /tmp/downloads
            
            echo "--- Iteration $COUNTER: Starting download ---"
            
            curl --location-trusted \
              --anyauth \
              --fail \
              --show-error \
              --retry 3 \
              --connect-timeout 30 \
              -u "$USER:$PASS" \
              -o downloaded_file \
              "$URL"

            echo "Download completed!"
            ls -lh downloaded_file
            
            echo "Deleting file to restart the cycle..."
            rm downloaded_file
            
            # Increase the counter for the next loop
            COUNTER=$((COUNTER + 1))
          done

      - name: Cleanup
        if: always()
        run: |
          rm -rf /tmp/downloads
          echo "Temporary files deleted."
